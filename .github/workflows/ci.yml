name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  preview:
    name: Preview deploy
    needs: build
    # Forks and Dependabot can't read the deploy secret.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      HAS_DEPLOY_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PHOTO_BOOTH_41 != '' }}
    steps:
      - name: Skip without deploy secret
        if: env.HAS_DEPLOY_SECRET != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT_PHOTO_BOOTH_41 isn't set, so no preview was deployed. Add it in the repo's Actions secrets to enable previews."

      - uses: actions/checkout@v7
        if: env.HAS_DEPLOY_SECRET == 'true'

      - uses: actions/download-artifact@v8
        if: env.HAS_DEPLOY_SECRET == 'true'
        with:
          name: dist
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        if: env.HAS_DEPLOY_SECRET == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PHOTO_BOOTH_41 }}
          projectId: photo-booth-41
          expires: 7d
